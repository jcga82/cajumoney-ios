name: CajuriteFinance

options:
  bundleIdPrefix: es.cajurite
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # Xcode lo rellena al abrir con tu cuenta

targets:
  CajuriteFinance:
    type: application
    platform: iOS
    sources:
      - path: CajuriteFinance
    assets: CajuriteFinance/Assets.xcassets
    info:
      path: CajuriteFinance/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Cajurite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.cajurite.finance
        INFOPLIST_FILE: CajuriteFinance/Info.plist
